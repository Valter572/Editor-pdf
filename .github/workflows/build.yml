name: Build Manipulapdfs

on: [workflow_dispatch, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executaveis
        run: pyinstaller --clean --noconfirm Manipulapdfs.spec

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Manipulapdfs-windows
          path: |
            dist/Manipulapdfs.exe
            dist/Manipulapdfs-cli.exe
